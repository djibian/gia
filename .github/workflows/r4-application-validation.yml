name: R4 application validation

on:
  pull_request:
    paths:
      - ".github/workflows/r4-application-validation.yml"
      - "tools/r4-harness.ts"
      - "tools/r4-application-fixtures.ts"
      - "tools/r4-application-validation-probe.ts"
      - "docs/R4-APPLICATION-VALIDATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  applications:
    name: Existing apps on Grist Community 1.7.19
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Grist Community
        run: |
          docker run --detach --name r4-grist \
            --publish 8484:8484 \
            --env GRIST_SESSION_SECRET=r4-application-validation-session \
            --env GRIST_IN_SERVICE=true \
            --env GRIST_TEST_LOGIN=1 \
            --env GRIST_LOG_LEVEL=warn \
            gristlabs/grist-oss:1.7.19

      - name: Wait for Grist Community
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:8484/api/orgs >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs r4-grist
          exit 1

      - name: Exercise existing, stage-tracking and CCF applications
        env:
          GRIST_R4_BASE_URL: http://127.0.0.1:8484
          GRIST_R4_VERSION: "1.7.19"
        run: npx tsx tools/r4-application-validation-probe.ts

      - name: Grist logs on failure
        if: failure()
        run: docker logs r4-grist || true
