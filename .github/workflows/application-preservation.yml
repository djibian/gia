name: Application preservation

on:
  pull_request:
    paths:
      - ".github/workflows/application-preservation.yml"
      - "tools/grist-harness.ts"
      - "tools/application-fixtures.ts"
      - "tools/application-validation.ts"
      - "docs/SECURITY.md"
      - "src/**"
      - "test/**"
      - "package*.json"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  applications:
    name: Existing apps on Grist Community 1.7.19
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Grist Community
        run: |
          docker run --detach --name test-grist \
            --publish 8484:8484 \
            --env GRIST_SESSION_SECRET=application-validation-session \
            --env GRIST_IN_SERVICE=true \
            --env GRIST_TEST_LOGIN=1 \
            --env GRIST_LOG_LEVEL=warn \
            gristlabs/grist-oss:1.7.19

      - name: Wait for Grist Community
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:8484/api/orgs >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs test-grist
          exit 1

      - name: Exercise existing, stage-tracking and CCF applications
        env:
          GRIST_TEST_BASE_URL: http://127.0.0.1:8484
          GRIST_TEST_VERSION: "1.7.19"
        run: node --import tsx tools/application-validation.ts

      - name: Grist logs on failure
        if: failure()
        run: docker logs test-grist || true
