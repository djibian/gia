name: Release lock refresh

on:
  push:
    branches: ["release/v0.6.0"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh lockfile mechanically
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm version 0.6.0 --no-git-tag-version --allow-same-version
          python3 - <<'PY'
          import json
          from pathlib import Path

          before = Path('/tmp/package-lock.before.json').read_text()
          after = Path('package-lock.json').read_text()
          before_json = json.loads(before)
          after_json = json.loads(after)

          assert before_json['version'] == '0.5.0'
          assert before_json['packages']['']['version'] == '0.5.0'
          assert after_json['version'] == '0.6.0'
          assert after_json['packages']['']['version'] == '0.6.0'

          expected = before.replace('"version": "0.5.0"', '"version": "0.6.0"', 2)
          if after != expected:
              raise SystemExit('package-lock.json changed beyond the two required root version metadata fields')
          PY
          git diff --exit-code -- package.json src/version.ts
          git diff -- package-lock.json
      - name: Commit mechanical lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "No lockfile change produced"; exit 1; }
          git commit -m "Refresh lockfile release version mechanically"
          git push origin HEAD:release/v0.6.0
