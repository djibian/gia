name: Refresh package lock metadata for Gia

on:
  push:
    branches: ["work/rename-product-gia"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh lockfile mechanically
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify only root package name metadata changed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          before.name = 'gia';
          before.packages[''].name = 'gia';

          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonical(value[key])])
              );
            }
            return value;
          };

          if (JSON.stringify(canonical(before)) !== JSON.stringify(canonical(after))) {
            console.error('Refusing commit: npm changed package-lock.json beyond the two root name metadata fields.');
            process.exit(1);
          }
          NODE
          git diff -- package-lock.json
      - name: Commit generated lockfile and remove temporary workflow
        run: |
          rm .github/workflows/refresh-package-lock-gia.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-package-lock-gia.yml
          git commit -m "Refresh package lock metadata for Gia"
          git push origin HEAD:work/rename-product-gia
