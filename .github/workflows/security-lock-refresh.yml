name: Security lock refresh helper

on:
  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/security-lock-refresh.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'fix/security-dependency-refresh-2026-11'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile mechanically
        run: npm install --package-lock-only --ignore-scripts
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "security: regenerate audited package lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
