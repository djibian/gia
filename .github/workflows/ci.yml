name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check:convergence
      # Temporary lockfile generation for this security candidate only.
      - name: Regenerate public npm lockfile candidate
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo GIA_PUBLIC_LOCK_BEGIN
          base64 -w0 package-lock.json | fold -w 120
          echo GIA_PUBLIC_LOCK_END
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
