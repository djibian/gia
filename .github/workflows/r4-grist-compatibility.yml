name: R4 Grist Community compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/r4-grist-compatibility.yml"
      - "tools/r4-grist-compatibility-probe.ts"
      - "docs/R4-COMPATIBILITY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Grist Community ${{ matrix.grist_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        grist_version:
          - "1.7.16"
          - "1.7.17"
          - "1.7.18"
          - "1.7.19"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Grist Community
        run: |
          docker run --detach --name r4-grist \
            --publish 8484:8484 \
            --env GRIST_SESSION_SECRET=r4-compatibility-session-secret \
            --env GRIST_IN_SERVICE=true \
            --env GRIST_TEST_LOGIN=1 \
            --env GRIST_LOG_LEVEL=warn \
            gristlabs/grist-oss:${{ matrix.grist_version }}

      - name: Wait for Grist Community
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:8484/api/orgs >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs r4-grist
          exit 1

      - name: Exercise MCP v2 candidate
        env:
          GRIST_COMPAT_BASE_URL: http://127.0.0.1:8484
          GRIST_COMPAT_VERSION: ${{ matrix.grist_version }}
        run: npx tsx tools/r4-grist-compatibility-probe.ts

      - name: Grist logs on failure
        if: failure()
        run: docker logs r4-grist || true
